<tr>
  <td class="td-num">{{ idx + 1 }}</td>
  <td><input type="text" name="att_name_{{ idx }}"    maxlength="128"></td>
  <td><input type="text" name="att_sig_{{ idx }}"     maxlength="128"></td>
